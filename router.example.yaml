# MikroTik Router Configuration Example (role: router)
#
# Use this role when the MikroTik is the gateway, not an access point.
# It keeps NAT, DHCP, DNS and the firewall, and it fails over between
# two or more uplinks.
#
# The other roles in this tool do the opposite. A standalone, controller,
# or cap device strips router functions, because it sits behind someone
# else's gateway. Do not mix the two on one device.
#
# Apply with:
#   ./apply-config.js router.yaml
#
# Tested on the MikroTik Chateau LTE6 (D53G-5HacD2HnD&EG06-A), which pairs
# five Ethernet ports with a built-in LTE modem.

device:
  host: 192.168.88.1        # factory address; change once the LAN moves
  username: admin
  password: admin

role: router

# ---------------------------------------------------------------------------
# LAN
# ---------------------------------------------------------------------------
# The router owns this network. It hands out addresses and answers DNS.
lan:
  address: 192.168.80.1/24  # router's own address, in CIDR form

  ports:                    # ports that join the LAN bridge
    - ether2                # never list a WAN port here
    - ether3
    - ether4
    - ether5

  dhcpServer:
    pool: 192.168.80.100-192.168.80.200
    leaseTime: 12h
    # dns: [192.168.80.1]   # what clients are told to use; defaults to the router

  dns:
    servers:                # the router's own resolvers
      - 9.9.9.9
      - 149.112.112.112
    allowRemoteRequests: true   # let LAN clients resolve through the router
    #
    # Keep these addresses DIFFERENT from every uplink's `probe` below.
    # A probe address is pinned to its uplink by a route with no health check.
    # If that uplink is up but the path beyond it is dead, the pin stays and the
    # address stops answering. A resolver pinned that way stalls every query
    # that picks it, exactly when the network is already degraded.
    # Applying warns about an overlap rather than failing on it.

  # Fasttrack makes forwarding faster by letting established flows skip
  # connection tracking. That also means stale sessions linger longer after a
  # failover. Off by default. Turn it on if throughput matters more than
  # failover cleanliness.
  # fasttrack: true

  # -------------------------------------------------------------------------
  # Management plane (optional, and hardened whether or not you write it)
  # -------------------------------------------------------------------------
  # Applying ALWAYS binds every /ip service entry - ssh, www, winbox, api, and
  # the disabled ones too - to the network derived from lan.address above, so
  # RouterOS itself refuses a connection from off-LAN. telnet and ftp are
  # disabled, and MAC-telnet, MAC-winbox and neighbor discovery are scoped to
  # the LAN interface list, because those run over layer 2 and ignore both the
  # service binding and the firewall.
  #
  # You do not need this block. It only exists to widen or soften the defaults,
  # and NOTHING you can write in it opens management to the WAN.
  #
  # management:
  #   allow:
  #     - 100.64.0.0/10     # a Tailscale/WireGuard overlay
  #     - 10.9.0.0/24       # a management VLAN reached over a VPN
  #
  #     Extra SOURCE ranges that may reach the management services, on top of
  #     the LAN. Every entry must be non-globally-routable - RFC1918, CGNAT,
  #     link-local or loopback - so no entry can ever name an internet source.
  #     Entries are also checked against the addresses actually on your uplinks
  #     when applying: a private range that happens to BE your WAN (a double-NAT
  #     uplink on 192.168.4.0/22, say) is dropped and reported.
  #
  #   cleartext: true
  #     Keep telnet and ftp enabled. They stay bound to the LAN like everything
  #     else, so this is a LAN-sniffing decision, not a WAN one. Default is to
  #     disable them: both send the password in clear, and this tool drives
  #     devices over SSH.
  #
  # LOCKOUT SAFETY. Before restricting anything, the tool asks the DEVICE which
  # sessions are connected to it (`/user active print terse`) and skips the
  # whole restriction unless every one of them is covered. Being unable to tell
  # counts as not covered. So applying from a jump host, a VPN, or over the WAN
  # address leaves the services open and says so loudly - the firewall rule
  # still keeps the uplinks closed - rather than locking you out of a remote
  # gateway. Re-apply from the LAN, or add your range to `allow`, and it lands.
  #
  # Note that changing lan.address means run one is made from the OLD subnet,
  # so the restriction is skipped; run two, from the new address, applies it.

  # TCP MSS clamping, on by default. An uplink narrower than 1500 bytes - PPPoE
  # at 1492, most LTE bearers - needs each end told how much it may send. The
  # normal way to learn that is path MTU discovery, which relies on an ICMP
  # reply that many networks drop. When it is dropped, connections open and then
  # die on the first full-size segment: small requests work, large ones stall.
  # Clamping the outbound SYN says the limit up front, so the far end never
  # sends a segment too big for the uplink.
  # It costs nothing on a 1500-byte uplink, where it clamps to the same value.
  # This changes segment size, never rate. A slow uplink stays slow.
  # mssClamp: false

# ---------------------------------------------------------------------------
# WAN
# ---------------------------------------------------------------------------
# List every uplink. The lowest distance is preferred; the rest are standby.
#
# Each uplink needs its own `probe` address. The router pins that address to
# that uplink and pings it every few seconds. If the pings stop, the uplink is
# marked down and the next one takes over.
#
# Why probe a far-away address instead of the next hop: a cable modem that has
# lost its own uplink still answers pings on its LAN side. Checking only the
# next hop would never notice. Checking 8.8.8.8 does.
#
# Two failures, two speeds (measured on a Chateau LTE6, wired to LTE):
#   - Link goes down (cable pulled):   ~1 second. The route stops resolving.
#   - Link up but path dead (ISP out): 20-30 seconds. Pings must time out.
#   - Link comes back:                 ~36 seconds, waiting on DHCP to re-bind.
wan:
  - name: primary
    interface: ether1
    type: dhcp              # dhcp | static | pppoe | lte
    distance: 1             # lower wins
    probe: 8.8.8.8

  - name: backup
    interface: lte1
    type: lte
    distance: 2
    probe: 1.1.1.1          # must differ from every other probe
    # apn: fast.t-mobile.com
    #   Leave apn out to use whatever the network supplies.
    #   If `/interface lte monitor lte1 once` says connected but the link
    #   carries no traffic, the APN is usually why. Check the carrier's.

  # A static uplink needs both an address and a gateway:
  # - name: fiber
  #   interface: ether5
  #   type: static
  #   address: 203.0.113.10/30
  #   gateway: 203.0.113.9
  #   distance: 1
  #   probe: 9.9.9.9

  # A PPPoE uplink dials out over an Ethernet port:
  # - name: dsl
  #   interface: ether5
  #   type: pppoe
  #   user: myaccount@isp.example
  #   password: secret
  #   distance: 3
  #   probe: 208.67.222.222

# ---------------------------------------------------------------------------
# WAN change notification (optional)
# ---------------------------------------------------------------------------
# Push a message when the active uplink changes - wired to LTE, and back.
# Leave this block out and nothing is installed. Remove it later and the
# notifier is removed from the device on the next apply.
#
# notify:
#   url: https://ntfy.sh/your-topic-here
#     A plain HTTP POST target. ntfy is the easy one, but any endpoint that
#     accepts a POST works. The message body is:
#       <router identity> WAN: <previous uplink> -> <current uplink>
#     using the uplink NAMES from the wan: block above.
#
#   title: office router failover
#     Optional. Sent as an "X-Title:" header, which ntfy shows as the
#     notification title. No commas - RouterOS separates header fields with
#     them. Other endpoints can ignore the header.
#
#   interval: 30s
#     Optional, defaults to 30s. How often the device checks. Detection is
#     therefore up to one interval slower than the failover itself. Keep it
#     comfortably above 10s: that is roughly how long /tool fetch takes to
#     give up on an unreachable endpoint, and the check blocks meanwhile.
#
#   checkCertificate: false
#     Optional, defaults to false. A factory device has NO CA certificates
#     (`/certificate print count-only` returns 0) and often lacks the flash to
#     import a bundle, so verification is off unless you have imported one.
#
# What it installs: a `wan-notify` script and a scheduler of the same name,
# both commented "router:wan-notify". Re-applying replaces them; anything else
# on the device is left alone.
#
# How it remembers which uplink was last active: in the script's own comment,
# `router:wan-notify state=<uplink>`. Not a `:global` - a global set by a
# script the SCHEDULER runs is discarded before the next tick, so every tick
# would notify again. (It looks fine when tested by hand, because
# `/system script run` does keep globals. That is the trap.) A comment is
# config, so it also survives a reboot, and it is written only on a real
# change.
#
# The state advances only after the POST succeeds, so a failover that took the
# internet with it retries on the next tick instead of losing the message.
# Both outcomes are logged: `/log print where message~"wan-notify"`.
#
# FIRST, ON A DEVICE IN device-mode `home` (the Chateau LTE6 ships this way),
# BOTH `fetch` AND `scheduler` ARE DISABLED. Applying tells you so and stops
# at this feature. To unlock, on the device:
#
#     /system/device-mode/update scheduler=yes fetch=yes
#
# then power-cycle it or press the reset button WITHIN 5 MINUTES. RouterOS
# wants proof of physical access; no tool can do it for you. Check the current
# state with `/system/device-mode/print`.

# ---------------------------------------------------------------------------
# WiFi (optional)
# ---------------------------------------------------------------------------
# A router with no WiFi is valid. Leave these out and the radios are untouched.
#
# SSIDs on a router join the untagged LAN bridge, so `vlan` is optional here.
# Every other role requires it, because those devices tag traffic for an
# upstream switch to sort out. This device is the upstream.
#
# wifi:
#   country: United States
#   2.4GHz:
#     channel: 1
#     width: 20mhz
#   5GHz:
#     channel: 36
#     width: 20/40/80mhz
#
# ssids:
#   - ssid: MyNetwork
#     passphrase: secure-password-here
#     bands:
#       - 2.4GHz
#       - 5GHz

# ---------------------------------------------------------------------------
# Optional extras
# ---------------------------------------------------------------------------
# igmpSnooping: true        # trims multicast flooding (Sonos, Chromecast)
#
# syslog:
#   server: 10.0.0.100
#   port: 514
#   topics:
#     - wireless

# ---------------------------------------------------------------------------
# Moving the LAN address without locking yourself out
# ---------------------------------------------------------------------------
# Changing lan.address cuts the session that is applying the change. The tool
# handles this by adding before it removes.
#
# Run one, over the old address:
#   the new address goes on, the old one stays, both answer.
# Run two, over the new address:
#   the old address is removed and the rest is verified.
#
# There is never a moment when the device has no reachable address.
